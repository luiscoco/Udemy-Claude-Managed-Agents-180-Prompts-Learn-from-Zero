name: Application problem
description: Report a reproducible problem in a numbered lesson.
title: "[Lesson NN] "
body:
  - type: input
    id: lesson
    attributes:
      label: Lesson number
      description: Choose a number from 1 to 180.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version and browser version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, expected behavior and actual behavior. Remove API keys and personal data.
    validations:
      required: true
